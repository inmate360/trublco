version: '3.8'

services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: trublco-app
    container_name: trublco-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-doublelist_clone}
      DB_USERNAME: ${DB_USERNAME:-doublelist_clone}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      REDIS_HOST: redis
    volumes:
      - ./:/var/www
    networks:
      - trublco-network

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: trublco-nginx
    restart: unless-stopped
    tty: true
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - trublco-network
    depends_on:
      - app

  # MySQL Service
  db:
    image: mysql:8.0
    container_name: trublco-db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-doublelist_clone}
      MYSQL_USER: ${DB_USERNAME:-doublelist_clone}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - trublco-network

  # Redis Service for Caching
  redis:
    image: redis:alpine
    container_name: trublco-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - trublco-network

networks:
  trublco-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
