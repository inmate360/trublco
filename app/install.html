<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install trubl App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'gh-bg': '#0a0a0a',
                        'gh-panel': '#151515',
                        'gh-accent': '#ec4899',
                        'gh-muted': '#9ca3af',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gh-bg text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <div class="inline-flex h-20 w-20 rounded-full bg-gradient-to-br from-pink-500 to-purple-500 items-center justify-center text-3xl font-bold mb-4">
                T
            </div>
            <h1 class="text-3xl font-bold mb-2">Get the trubl App</h1>
            <p class="text-gh-muted">Install our app for the best experience</p>
        </div>

        <div class="bg-gh-panel rounded-2xl p-6 mb-6">
            <div class="space-y-4">
                <div class="flex items-start gap-3">
                    <i class="bi bi-lightning-charge-fill text-2xl text-gh-accent mt-1"></i>
                    <div>
                        <h3 class="font-semibold mb-1">Lightning Fast</h3>
                        <p class="text-sm text-gh-muted">Instant loading, smooth animations</p>
                    </div>
                </div>
                <div class="flex items-start gap-3">
                    <i class="bi bi-wifi-off text-2xl text-gh-accent mt-1"></i>
                    <div>
                        <h3 class="font-semibold mb-1">Works Offline</h3>
                        <p class="text-sm text-gh-muted">Browse personals even without internet</p>
                    </div>
                </div>
                <div class="flex items-start gap-3">
                    <i class="bi bi-bell-fill text-2xl text-gh-accent mt-1"></i>
                    <div>
                        <h3 class="font-semibold mb-1">Get Notified</h3>
                        <p class="text-sm text-gh-muted">Never miss new messages or matches</p>
                    </div>
                </div>
            </div>
        </div>

        <button onclick="installApp()" id="installBtn" class="w-full bg-gh-accent text-white py-4 rounded-xl font-semibold text-lg mb-4 hover:opacity-90 transition-opacity">
            <i class="bi bi-download mr-2"></i>
            Install App
        </button>

        <a href="trubl-app.html" class="block text-center text-gh-muted hover:text-white transition-colors">
            Or continue in browser →
        </a>

        <div class="mt-8 text-center text-sm text-gh-muted">
            <p class="mb-2">Available on:</p>
            <div class="flex justify-center gap-4">
                <span>📱 Android</span>
                <span>🍎 iOS</span>
                <span>💻 Desktop</span>
            </div>
        </div>
    </div>

    <script>
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'block';
        });

        async function installApp() {
            if (!deferredPrompt) {
                // If install prompt not available, redirect to app
                window.location.href = 'trubl-app.html';
                return;
            }

            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;

            if (outcome === 'accepted') {
                console.log('User accepted the install prompt');
            }

            deferredPrompt = null;
        }

        // Redirect if already installed
        if (window.matchMedia('(display-mode: standalone)').matches) {
            window.location.href = 'trubl-app.html';
        }
    </script>
</body>
</html>
